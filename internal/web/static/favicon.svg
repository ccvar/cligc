<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="cligc">
  <!-- 不带底板：底板在深色标签栏上会变成一个突兀的黑方块，而它本来只是
       为了解决"浅色描边在浅色标签栏上看不见"。那个问题用 SVG 里的
       prefers-color-scheme 直接解决更干净——描边跟着标签栏底色走。

       实心圆用蓝色，两种底色下都立得住，所以不需要跟着变。
       几何与导航栏的站标同构，按比例放大填满画布。 -->
  <style>
    .ring { stroke: #4a4d57; }
    .disc { fill: #2b4acb; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #c6c9d4; }
      .disc { fill: #3b6bff; }
    }
  </style>
  <circle class="ring" cx="13.5" cy="13.5" r="9.2" fill="none" stroke-width="2.6"/>
  <circle class="disc" cx="21.6" cy="21.6" r="6.3"/>
</svg>
